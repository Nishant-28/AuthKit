spring.application.name=AuthKit
server.port=8081
jwt.secret=${JWT_SECRET:defaultsecretkeythatisatleast32characterslong123}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.datasource.url=jdbc:postgresql://localhost:5432/authkit
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.redis.host=localhost
spring.data.redis.port=6379
#spring.data.redis.password=${REDIS_PASSWORD}
